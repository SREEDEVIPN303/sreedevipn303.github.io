<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SensorHub dashboard</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#e8ecf8}
 main{max-width:960px;margin:0 auto;padding:24px}
 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:18px 0}
 .card{background:#141c38;border:1px solid #242f55;border-radius:12px;padding:14px;cursor:pointer}
 .card.on{border-color:#7c9cff}.card.alert b{color:#ff8a8a}
 .card b{font-size:1.6rem;display:block}.card small{color:#9aa6cc}
 canvas{width:100%;height:280px;background:#0a0f1f;border:1px solid #242f55;border-radius:12px}
</style>
</head>
<body><main>
<h1>SensorHub</h1><p>Live readings pushed by IoT devices via the REST API. Refreshes every 5 seconds.</p>
<div class="cards" id="cards"></div>
<canvas id="chart" width="900" height="280"></canvas>
<script>
let sensors = [], current = null;
const cards = document.getElementById('cards'), cv = document.getElementById('chart'), ctx = cv.getContext('2d');

async function loadSensors(){
  const r = await fetch('api/sensors/'); sensors = (await r.json()).sensors;
  if(!current && sensors.length) current = sensors[0].id;
  cards.innerHTML = '';
  sensors.forEach(s => {
    const d = document.createElement('div');
    const alert = s.latest && s.latest.alert;
    d.className = 'card' + (s.id === current ? ' on' : '') + (alert ? ' alert' : '');
    d.innerHTML = `<small>${s.location}</small><div>${s.name}</div><b>${s.latest ? s.latest.value : '–'} ${s.unit}</b><small>${alert ? '⚠ above threshold ' + s.threshold : 'normal'}</small>`;
    d.onclick = () => { current = s.id; refresh(); };
    cards.appendChild(d);
  });
}
async function drawChart(){
  if(!current) return;
  const r = await fetch(`api/sensors/${current}/readings/?limit=40`), j = await r.json();
  const v = j.readings.map(x => x.value); if(!v.length) return;
  const W = cv.width, H = cv.height, p = 30;
  const max = Math.max(...v, j.threshold || 0) * 1.1, min = Math.min(...v) * 0.9;
  const y = n => H - p - (n - min) / (max - min) * (H - 2*p), x = i => p + i * (W - 2*p) / Math.max(1, v.length - 1);
  ctx.clearRect(0,0,W,H);
  if(j.threshold){ ctx.strokeStyle = '#ffb86b'; ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(p,y(j.threshold)); ctx.lineTo(W-p,y(j.threshold)); ctx.stroke(); ctx.setLineDash([]); }
  ctx.strokeStyle = '#46e0c1'; ctx.lineWidth = 2; ctx.beginPath();
  v.forEach((n,i) => i ? ctx.lineTo(x(i),y(n)) : ctx.moveTo(x(i),y(n))); ctx.stroke();
  ctx.fillStyle = '#9aa6cc'; ctx.fillText(`${j.sensor} (${j.unit})`, p, 16);
}
async function refresh(){ await loadSensors(); await drawChart(); }
refresh(); setInterval(refresh, 5000);
</script>
</main></body></html>
